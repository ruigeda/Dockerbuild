name: postgres:15-alpine

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: '镜像全名，例如 postgres:16 或 redis:7-alpine'
        required: true
      platform:
        description: '目标架构'
        default: 'linux/amd64'

jobs:
  pull_and_save:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub (突破匿名限速)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true   # 如果没配密钥也不中断

      - name: Pull & Save & Compress
        run: |
          docker pull --platform ${{ github.event.inputs.platform }} ${{ github.event.inputs.image_name }}
          
          # 用镜像名中的 tag 作为文件名，避免特殊字符
          SAFE_NAME=$(echo "${{ github.event.inputs.image_name }}" | tr '/:' '_')
          
          # docker save 后立刻 gzip，体积通常能压到 30%~50%
          docker save ${{ github.event.inputs.image_name }} | gzip > ${SAFE_NAME}.tar.gz
          
          ls -lh ${SAFE_NAME}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: "*.tar.gz"
          retention-days: 5   # 只保留5天，省空间
